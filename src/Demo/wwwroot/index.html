<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorResourceTimeline.Demo</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorResourceTimeline.Demo.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Theme helpers for the demo page. Apply the system preference once,
        // synchronously, before Blazor boots. Do not use window.onload - that
        // races with Blazor and can overwrite the theme after the app has set it.
        window.getPreferredDemoTheme = function () {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };
        window.setDemoTheme = function (theme) {
            document.documentElement.setAttribute('data-theme', theme);
        };
        window.setDemoTheme(window.getPreferredDemoTheme());

        // Page-level day/week panning. The component exposes PanByDaysAsync
        // but does not bind those keys itself, so the demo owns them - except
        // when the timeline is focused, in which case its bar-focus arrows
        // take priority and this handler stands aside.
        window.registerDemoPanKeys = function (dotNetRef) {
            window.unregisterDemoPanKeys();
            window._demoPanKeys = {
                ref: dotNetRef,
                handler: function (e) {
                    if (e.altKey || e.shiftKey) return;
                    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                    const target = e.target;
                    if (target && target.closest &&
                        target.closest('input, select, textarea, [contenteditable="true"], .ctx-menu, .timeline-wrapper')) {
                        return;
                    }
                    e.preventDefault();
                    e.stopPropagation();
                    const days = (e.ctrlKey || e.metaKey) ? 7 : 1;
                    const dir = e.key === 'ArrowLeft' ? -days : days;
                    window._demoPanKeys.ref.invokeMethodAsync('PanFromKeyboard', dir);
                }
            };
            document.addEventListener('keydown', window._demoPanKeys.handler, true);
        };
        window.unregisterDemoPanKeys = function () {
            if (!window._demoPanKeys) return;
            document.removeEventListener('keydown', window._demoPanKeys.handler, true);
            window._demoPanKeys = null;
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
