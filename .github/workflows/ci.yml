name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (8/9/10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Needed to build the Blazor WebAssembly demo project.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore src/BlazorResourceTimeline.slnx

      - name: Build
        run: dotnet build src/BlazorResourceTimeline.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/BlazorResourceTimeline.slnx -c Release --no-build --verbosity normal

      # The rendering engine is JavaScript; its layout, time-zone and indexing
      # logic is covered by node's built-in test runner (no npm dependencies).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test (rendering engine)
        run: node --test "src/Tests/js/**/*.test.mjs"

      - name: Pack
        run: dotnet pack src/BlazorResourceTimeline/BlazorResourceTimeline.csproj -c Release --no-build -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          # Both the package and its symbol (.snupkg) sibling.
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'msynk/BlazorResourceTimeline'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (8/9/10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # The version is taken from the tag (e.g. v1.2.3 -> 1.2.3), overriding
      # the <Version> in the csproj so releases are driven by tags.
      - name: Derive version from tag
        run: |
          PKG_VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$PKG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not yield a valid version (got '$PKG_VERSION'). Expected vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Pack
        run: dotnet pack src/BlazorResourceTimeline/BlazorResourceTimeline.csproj -c Release -p:Version=$PKG_VERSION -o artifacts

      # Pushing the .nupkg also pushes the matching .snupkg sitting next to it.
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a '-' (e.g. 1.0.0-preview.1) is marked as a prerelease.
          PRERELEASE=""
          case "$PKG_VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "v$PKG_VERSION" \
            --generate-notes \
            $PRERELEASE
